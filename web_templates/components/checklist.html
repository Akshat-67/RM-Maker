<!-- STEP 3: LIVE CHECKLIST & AI PROOFREADER WORKSPACE -->
<div id="step-checklist-view" class="split-workspace d-none">
    
    <!-- Left Panel: Document Checklist console -->
    <div class="preview-pane" style="width: 45%; border-right: 1px solid #E5E5E0; padding: 20px; display: flex; flex-direction: column; background: #ffffff;">
        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom flex-shrink-0">
            <h5 class="m-0 fw-bold text-dark"><span class="me-2">📋</span>Live Document Checklist</h5>
            <button class="btn btn-primary font-monospace py-1.5 px-3 shadow-sm fw-bold" style="font-size: 0.8rem; border-radius: 6px;" onclick="triggerAIProofreader()" id="btnRunProofreader">🤖 AI Proofread</button>
        </div>
        
        <div class="alert alert-secondary p-3 mb-3 d-flex align-items-center justify-content-between flex-shrink-0" style="font-size: 0.82rem; border-radius: 6px;">
            <span id="validationStatusText" class="fw-medium text-secondary">Checking case details...</span>
            <span class="spinner-border spinner-border-sm text-secondary d-none" id="validationSpinner" role="status"></span>
        </div>
        
        <div id="validationChecklistContent" style="flex-grow: 1; overflow-y: auto; padding-right: 5px;">
            <!-- Dynamic errors / warnings list -->
        </div>
    </div>

    <!-- Right Panel: Live Compiled Word Preview -->
    <div class="editor-pane" style="width: 55%; padding: 20px; background-color: #f8fafc; display: flex; flex-direction: column;">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom flex-shrink-0">
            <span class="small fw-bold text-secondary text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">📄 Live Compiled Word Preview</span>
            <button class="btn btn-xs btn-outline-primary py-1 px-3 fw-bold" onclick="refreshDraftPreview()" style="font-size: 0.72rem; border-radius: 4px;">🔄 Update Preview</button>
        </div>
        
        <div id="draftPreviewContent" style="flex-grow: 1; overflow-y: auto; padding: 25px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; font-family: 'Segoe UI', 'Mangal'; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
            <div class="text-center py-5 text-muted">
                <span class="fs-1 d-block mb-3">📑</span>
                <span style="font-size: 0.85rem;">Click "Update Preview" above to generate a live HTML view of the draft template.</span>
            </div>
        </div>
    </div>
</div>
