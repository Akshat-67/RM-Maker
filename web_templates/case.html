<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalDoc Automator Pro - Case Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}?v=2.3">
    <script src="https://cdn.jsdelivr.net/npm/@indic-transliteration/sanscript@1.1.0/sanscript.min.js"></script>
</head>
<body>
    <!-- Top Header Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4 py-2 flex-shrink-0">
        <span class="navbar-brand mb-0 h1" style="font-size: 1.1rem;">⚖️ LegalDoc Automator Pro</span>
        
        <!-- Step Toggles Switcher -->
        <div class="step-switcher-container">
            <button class="step-nav-btn active-step" id="step-indicator-upload" onclick="switchStep(1)">1. Configure & Upload</button>
            <button class="step-nav-btn" id="step-indicator-review" onclick="switchStep(2)">2. Verify & Review</button>
            <button class="step-nav-btn position-relative" id="step-indicator-checklist" onclick="switchStep(3)">
                3. Live Checklist
                <span id="checklist-count-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.62rem; transform: translate(-30%, -20%);">0</span>
            </button>
            <button class="step-nav-btn" id="step-indicator-chain" onclick="switchStep(4)">4. Title Chain Timeline</button>
        </div>

        <div class="d-flex align-items-center gap-2">
            <span class="text-muted small me-2" style="font-size: 0.8rem;">Case ID: <strong>{{ case_id }}</strong></span>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm px-2.5 py-1">Back to Dashboard</a>
            <button class="btn btn-primary btn-sm px-3 py-1 fw-bold" onclick="saveCase()">💾 Save Progress</button>
        </div>
    </nav>

    <!-- STEP 1: CONFIGURE AND UPLOAD SCREEN -->
    {% include 'components/upload.html' %}

    <!-- STEP 2: VERIFY AND REVIEW splitscreen WORKSPACE -->
    {% include 'components/review.html' %}

    <!-- STEP 3: LIVE CHECKLIST & AI PROOFREADER WORKSPACE -->
    {% include 'components/checklist.html' %}

    <!-- STEP 4: TITLE CHAIN TIMELINE WORKSPACE -->
    {% include 'components/timeline.html' %}
    <script>
    const CASE_ID = '{{ case_id }}';
    const DOC_TYPE = '{{ doc_type }}';
    const CASE_EXTRACTIONS = {{ extractions | tojson | safe if extractions else '{}' }};
    const CONFIDENCE_SCORES = {{ confidence_scores | tojson | safe if confidence_scores else '{}' }};

    // Optimistic concurrency – tracks the revision number the server last gave us.
    // Updated after every successful save; sent on every subsequent save request.
    let _caseRevision = {{ initial_revision | default(0) }};





    // Timeline variables
    let titleChainEvents = [];

    function loadTimelineEvents() {
        {% if doc_type == 'SD' %}
            titleChainEvents = {{ data.get('title_chain', []) | tojson }} || [];
        {% else %}
            titleChainEvents = [];
        {% endif %}
        
        if (titleChainEvents.length === 0) {
            titleChainEvents.push({
                event_type: 'SALE_DEED_PLOT',
                date: '',
                executant_name: '',
                claimant_name: '',
                reg_no: '',
                reg_book: '1',
                reg_vol: '',
                reg_page: '',
                consideration_amount: ''
            });
        }
    }

    function renderTimeline() {
        const list = document.getElementById('timelineNodesList');
        if (!list) return;
        
        list.innerHTML = "";
        const activeIdx = parseInt(document.getElementById('activeNodeIndex').value) || 0;
        
        titleChainEvents.forEach((event, idx) => {
            const node = document.createElement('div');
            node.className = `timeline-node ${idx === activeIdx ? 'active' : ''}`;
            node.onclick = () => selectNode(idx);
            
            let icon = "📄";
            let shortType = "Sale Deed";
            const type = event.event_type || 'SALE_DEED_PLOT';
            if (type.includes('ALLOTMENT')) {
                icon = "✉️";
                shortType = "Allotment";
            } else if (type.includes('TRANSFER')) {
                icon = "🔄";
                shortType = "Transfer";
            } else if (type.includes('GIFT')) {
                icon = "🎁";
                shortType = "Gift Deed";
            } else if (type.includes('POA')) {
                icon = "📋";
                shortType = "POA";
            } else if (type.includes('DEATH')) {
                icon = "✝️";
                shortType = "Succession";
            } else if (type.includes('HAK_TYAG')) {
                icon = "🤝";
                shortType = "Hak Tyag";
            } else if (type.includes('CONSTRUCTION')) {
                icon = "🏗️";
                shortType = "Construction";
            }
            
            node.innerHTML = `
                <div class="timeline-node-dot">
                    <span class="timeline-node-index">${idx + 1}</span>
                </div>
                <div class="timeline-node-content">
                    <div class="timeline-node-title text-truncate">${icon} ${shortType}</div>
                    <div class="timeline-node-date text-truncate small">${event.date || 'No Date'}</div>
                </div>
            `;
            list.appendChild(node);
        });
        
        const line = document.getElementById('timelineLine');
        if (line) {
            line.style.width = `calc(100% - 7rem)`;
        }
    }

    function selectNode(idx) {
        if (idx < 0 || idx >= titleChainEvents.length) return;
        document.getElementById('activeNodeIndex').value = idx;
        
        document.querySelectorAll('.timeline-node').forEach((node, i) => {
            if (i === idx) node.classList.add('active');
            else node.classList.remove('active');
        });
        
        const event = titleChainEvents[idx];
        document.getElementById('nodeEditorHeader').textContent = `Edit Chain Document #${idx + 1}`;
        document.getElementById('node_doc_type').value = event.template_key || event.event_type || 'SALE_DEED_PLOT';
        document.getElementById('node_date').value = event.date || '';
        document.getElementById('node_sellers').value = event.executant_name || event.s || '';
        document.getElementById('node_buyers').value = event.claimant_name || event.b || '';
        document.getElementById('node_reg_no').value = event.reg_no || event.r_no || '';
        document.getElementById('node_bahi_no').value = event.reg_book || event.b_no || '';
        document.getElementById('node_volume_no').value = event.reg_vol || event.v_no || '';
        document.getElementById('node_page_range').value = event.reg_add_page || event.additional_page_range || event.page_range || event.p_no || '';
        document.getElementById('node_consideration').value = event.consideration_amount || event.consideration || '';
    }

    function updateActiveNodeData() {
        const idx = parseInt(document.getElementById('activeNodeIndex').value) || 0;
        if (idx < 0 || idx >= titleChainEvents.length) return;
        
        const docTypeValue = document.getElementById('node_doc_type').value;
        titleChainEvents[idx].event_type = docTypeValue;
        titleChainEvents[idx].template_key = docTypeValue;
        titleChainEvents[idx].date = document.getElementById('node_date').value;
        titleChainEvents[idx].executant_name = document.getElementById('node_sellers').value;
        titleChainEvents[idx].s = document.getElementById('node_sellers').value;
        titleChainEvents[idx].claimant_name = document.getElementById('node_buyers').value;
        titleChainEvents[idx].b = document.getElementById('node_buyers').value;
        titleChainEvents[idx].reg_no = document.getElementById('node_reg_no').value;
        titleChainEvents[idx].r_no = document.getElementById('node_reg_no').value;
        titleChainEvents[idx].reg_book = document.getElementById('node_bahi_no').value;
        titleChainEvents[idx].b_no = document.getElementById('node_bahi_no').value;
        titleChainEvents[idx].reg_vol = document.getElementById('node_volume_no').value;
        titleChainEvents[idx].v_no = document.getElementById('node_volume_no').value;
        
        const pageRangeValue = document.getElementById('node_page_range').value;
        titleChainEvents[idx].reg_add_page = pageRangeValue;
        titleChainEvents[idx].additional_page_range = pageRangeValue;
        titleChainEvents[idx].page_range = pageRangeValue;
        titleChainEvents[idx].p_no = pageRangeValue;
        titleChainEvents[idx].consideration_amount = document.getElementById('node_consideration').value;
        titleChainEvents[idx].consideration = document.getElementById('node_consideration').value;
        
        const node = document.querySelectorAll('.timeline-node')[idx];
        if (node) {
            let icon = "📄";
            let shortType = "Sale Deed";
            const type = titleChainEvents[idx].event_type;
            if (type.includes('ALLOTMENT')) { icon = "✉️"; shortType = "Allotment"; }
            else if (type.includes('TRANSFER')) { icon = "🔄"; shortType = "Transfer"; }
            else if (type.includes('GIFT')) { icon = "🎁"; shortType = "Gift Deed"; }
            else if (type.includes('POA')) { icon = "📋"; shortType = "POA"; }
            else if (type.includes('DEATH')) { icon = "✝️"; shortType = "Succession"; }
            else if (type.includes('HAK_TYAG')) { icon = "🤝"; shortType = "Hak Tyag"; }
            else if (type.includes('CONSTRUCTION')) { icon = "🏗️"; shortType = "Construction"; }
            
            node.querySelector('.timeline-node-title').textContent = `${icon} ${shortType}`;
            node.querySelector('.timeline-node-date').textContent = titleChainEvents[idx].date || 'No Date';
        }
    }

    function addChainNode() {
        titleChainEvents.push({
            event_type: 'SALE_DEED_PLOT',
            date: '',
            executant_name: '',
            claimant_name: '',
            reg_no: '',
            reg_book: '1',
            reg_vol: '',
            reg_page: '',
            consideration_amount: ''
        });
        document.getElementById('activeNodeIndex').value = titleChainEvents.length - 1;
        renderTimeline();
        selectNode(titleChainEvents.length - 1);
    }

    function deleteActiveNode() {
        const idx = parseInt(document.getElementById('activeNodeIndex').value) || 0;
        if (titleChainEvents.length <= 1) {
            alert("A title chain must contain at least one document event.");
            return;
        }
        if (!confirm(`Are you sure you want to delete Document #${idx + 1}?`)) return;
        titleChainEvents.splice(idx, 1);
        const newActiveIdx = Math.max(0, idx - 1);
        document.getElementById('activeNodeIndex').value = newActiveIdx;
        renderTimeline();
        selectNode(newActiveIdx);
    }

    function moveNode(dir) {
        const idx = parseInt(document.getElementById('activeNodeIndex').value) || 0;
        const targetIdx = idx + dir;
        if (targetIdx < 0 || targetIdx >= titleChainEvents.length) return;
        
        const temp = titleChainEvents[idx];
        titleChainEvents[idx] = titleChainEvents[targetIdx];
        titleChainEvents[targetIdx] = temp;
        
        document.getElementById('activeNodeIndex').value = targetIdx;
        renderTimeline();
        selectNode(targetIdx);
    }

    function refreshNarrativePreview() {
        const textarea = document.getElementById('chainNarrativePreview');
        if (!textarea) return;
        
        document.getElementById('statusMsg').textContent = 'Re-generating Hindi Narrative...';
        updateActiveNodeData();
        
        fetch(`/case/${CASE_ID}/preview_chain`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ events: titleChainEvents })
        })
        .then(r => r.json())
        .then(resp => {
            if (resp.success) {
                textarea.value = resp.preview_text;
                document.getElementById('statusMsg').textContent = 'Narrative generated successfully.';
                document.getElementById('chain_is_manual_input').value = "false";
            } else {
                alert('Preview failed: ' + resp.error);
            }
        })
        .catch(e => alert('Error re-generating narrative: ' + e));
    }

    function syncNarrativeToMainData() {
        document.getElementById('chain_is_manual_input').value = "true";
    }

    // Call loadTimelineEvents on initialization
    loadTimelineEvents();



    function switchVerificationSection(targetId) {
        const tabBtn = document.querySelector(`#verificationTabs button[data-bs-target="#${targetId}"]`);
        if (tabBtn) {
            bootstrap.Tab.getOrCreateInstance(tabBtn).show();
        }
    }


    // Default step routing based on data existence with localStorage fallback
    const DEFAULT_STEP = {% if data %}2{% else %}1{% endif %};
    window.addEventListener('DOMContentLoaded', () => {
        const savedStep = localStorage.getItem('activeCaseStep_' + CASE_ID);
        if (savedStep) {
            switchStep(parseInt(savedStep));
        } else {
            switchStep(DEFAULT_STEP);
        }
    });
    const ALL_CASE_FILES = [
        {% for f in files %}"{{ f | basename }}",{% endfor %}
        {% for b_name, b_files in buckets.items() %}{% for f in b_files %}"{{ f | basename }}",{% endfor %}{% endfor %}
    ].filter((v, i, a) => a.indexOf(v) === i && v.trim() !== "");

    let customTemplateFilename = '{{ selected_template }}';
    let transliterationEnabled = false;
    let devlysEnabled = false;
    let devlysMapFrom = [];
    let devlysMapTo = [];
    let devlysAsciiWord = "";
    let devlysWordStart = -1;
    let devlysCurrentUnicodeLen = 0;

    // Fetch the DevLys 040 to Unicode conversion map from the server
    fetch('/devlys_keymap').then(r => r.json()).then(data => {
        if (data.success) {
            devlysMapFrom = data.map_from;
            devlysMapTo = data.map_to;
        }
    });

    function verifyAllFields() {
        const checks = document.querySelectorAll('.verify-check');
        const allChecked = Array.from(checks).every(c => c.checked);
        checks.forEach(c => c.checked = !allChecked);
    }

    function toggleItransMode() {
        transliterationEnabled = !transliterationEnabled;
        if (transliterationEnabled) {
            devlysEnabled = false;
            const devlysBtns = [document.getElementById('btnToggleDevLys'), document.getElementById('btnToggleDevLysTimeline')];
            devlysBtns.forEach(btn => {
                if (btn) {
                    btn.classList.replace('btn-info', 'btn-outline-info');
                    btn.innerHTML = '⌨️ DevLys (Off)';
                }
            });
            const devlysBadge = document.getElementById('devlysBadge');
            if (devlysBadge) devlysBadge.style.display = 'none';
        }
        
        const itransBtns = [document.getElementById('btnToggleItrans'), document.getElementById('btnToggleItransTimeline')];
        itransBtns.forEach(btn => {
            if (btn) {
                if (transliterationEnabled) {
                    btn.classList.replace('btn-outline-warning', 'btn-warning');
                    btn.innerHTML = 'A→अ ITRANS (ON)';
                } else {
                    btn.classList.replace('btn-warning', 'btn-outline-warning');
                    btn.innerHTML = 'A→अ ITRANS (Off)';
                }
            }
        });
        const transliterationBadge = document.getElementById('transliterationBadge');
        if (transliterationBadge) {
            transliterationBadge.style.display = transliterationEnabled ? 'inline-block' : 'none';
        }
        updateActiveModeIndicator();
    }

    function toggleDevLysMode() {
        devlysEnabled = !devlysEnabled;
        if (devlysEnabled) {
            transliterationEnabled = false;
            const itransBtns = [document.getElementById('btnToggleItrans'), document.getElementById('btnToggleItransTimeline')];
            itransBtns.forEach(btn => {
                if (btn) {
                    btn.classList.replace('btn-warning', 'btn-outline-warning');
                    btn.innerHTML = 'A→अ ITRANS (Off)';
                }
            });
            const transliterationBadge = document.getElementById('transliterationBadge');
            if (transliterationBadge) transliterationBadge.style.display = 'none';
        }
        
        const devlysBtns = [document.getElementById('btnToggleDevLys'), document.getElementById('btnToggleDevLysTimeline')];
        devlysBtns.forEach(btn => {
            if (btn) {
                if (devlysEnabled) {
                    btn.classList.replace('btn-outline-info', 'btn-info');
                    btn.innerHTML = '⌨️ DevLys (ON)';
                } else {
                    btn.classList.replace('btn-info', 'btn-outline-info');
                    btn.innerHTML = '⌨️ DevLys (Off)';
                }
            }
        });
        const devlysBadge = document.getElementById('devlysBadge');
        if (devlysBadge) {
            devlysBadge.style.display = devlysEnabled ? 'inline-block' : 'none';
        }
        updateActiveModeIndicator();
    }

    function updateActiveModeIndicator() {
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(el => {
            if (shouldTransliterate(el)) {
                if (transliterationEnabled || devlysEnabled) {
                    el.classList.add('hindi-mode');
                } else {
                    el.classList.remove('hindi-mode');
                }
            }
        });
    }

     function shouldTransliterate(el) {
        if (!el || !el.id) return false;
        const id = el.id.toLowerCase();
        if (id.endsWith('_en')) return false;
        if (id.includes('_id') || id.includes('_pan') || id.includes('_reg_no')) return false;
        if (id === 'chainnarrativepreview') return true;
        if (id === 'node_sellers' || id === 'node_buyers') return true;
        
        const label = el.closest('.col-md-6, .col-12, .col-md-9, .col-md-4, .col-8, .col-4')?.querySelector('label')?.textContent || "";
        const isHindiField = label.includes('(Hindi)') || label.includes('Address') || label.includes('Owner') || label.includes('Deed Type') || label.includes('Words') || label.includes('Relation') || label.includes('Name') || label.includes('Title');
        return isHindiField;
    }

    function convertDevlysToUnicode(word) {
        let hindi = "  " + word + "  ";
        let posF = hindi.indexOf("f");
        while (posF !== -1 && posF < hindi.length - 1) {
            hindi = hindi.substring(0, posF) + hindi.charAt(posF+1) + hindi.charAt(posF) + hindi.substring(posF+2);
            posF = hindi.indexOf("f", posF + 2);
        }
        hindi = hindi.trim();

        hindi = "  " + hindi + "  ";
        let posZ = hindi.indexOf("Z");
        const matras = ["‚", "ks", "kS", "k", "h", "q", "w", "`", "s", "S", "a", "¡", "%", "W", "·", "~ ", "~"];
        while (posZ !== -1) {
            hindi = hindi.replace("Z", "");
            if (matras.includes(hindi.charAt(posZ - 1))) {
                hindi = hindi.substring(0, posZ - 2) + "j~" + hindi.substring(posZ - 2);
            } else {
                hindi = hindi.substring(0, posZ - 1) + "j~" + hindi.substring(posZ - 1);
            }
            posZ = hindi.indexOf("Z");
        }
        hindi = hindi.trim();

        for (let i = 0; i < devlysMapFrom.length; i++) {
            hindi = hindi.split(devlysMapFrom[i]).join(devlysMapTo[i]);
        }
        return hindi;
    }

    // Set up global hotkeys and delegates for dynamically added inputs
    document.addEventListener('keydown', (e) => {
        // Ctrl + G: Toggle ITRANS
        if (e.ctrlKey && e.key.toLowerCase() === 'g') {
            e.preventDefault();
            toggleItransMode();
        }
        // Ctrl + D: Toggle DevLys
        if (e.ctrlKey && e.key.toLowerCase() === 'd') {
            e.preventDefault();
            toggleDevLysMode();
        }
    });




    function transliterateField(englishInput) {
        const text = englishInput.value.trim();
        if (!text) return;
        if (englishInput.dataset.lastTransliterated === text) return;

        const hindiInputId = englishInput.id.substring(0, englishInput.id.length - 3);
        const hindiInput = document.getElementById(hindiInputId);
        if (!hindiInput) return;

        englishInput.dataset.lastTransliterated = text;
        const originalPlaceholder = hindiInput.placeholder;
        hindiInput.placeholder = "⏳ Transliterating...";

        fetch('/transliterate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ text: text })
        })
        .then(r => r.json())
        .then(data => {
            hindiInput.placeholder = originalPlaceholder;
            if (data.success && data.result) {
                hindiInput.value = data.result;
                hindiInput.dispatchEvent(new Event('input', { bubbles: true }));
            } else {
                console.warn('API transliteration failed, falling back to Sanscript:', data.error);
                fallbackToSanscript(text, hindiInput);
            }
        })
        .catch(err => {
            hindiInput.placeholder = originalPlaceholder;
            console.error('Transliteration API error, falling back to Sanscript:', err);
            fallbackToSanscript(text, hindiInput);
        });
    }

    function fallbackToSanscript(text, hindiInput) {
        if (typeof Sanscript === 'undefined') {
            console.error('Sanscript library is not loaded.');
            return;
        }
        const words = text.split(/\s+/);
        const transliteratedWords = words.map(w => {
            if (/^[a-zA-Z]+$/.test(w)) {
                return Sanscript.t(w, 'itrans', 'devanagari', { syncope: true });
            }
            return w;
        });
        hindiInput.value = transliteratedWords.join(' ');
        hindiInput.dispatchEvent(new Event('input', { bubbles: true }));
    }

    document.addEventListener('DOMContentLoaded', () => {
        enforceEnglishDigits();
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadModels();
        updateTemplateDisplay();
        setupDropZone();

        // Autofocus search inputs when dropdowns open
        document.addEventListener('shown.bs.dropdown', function (e) {
            const dropdownMenu = e.target.nextElementSibling;
            if (dropdownMenu) {
                const searchInput = dropdownMenu.querySelector('input[type="text"]');
                if (searchInput) {
                    searchInput.focus();
                    searchInput.select();
                }
            }
        });

        // Listen for custom template upload
        const tFile = document.getElementById('templateFile');
        if (tFile) {
            tFile.addEventListener('change', function() {
                if (this.files.length === 0) return;
                const file = this.files[0];
                const formData = new FormData();
                formData.append('template', file);
                
                document.getElementById('statusMsg').textContent = 'Uploading custom template...';
                
                fetch(`/case/${CASE_ID}/upload_custom_template`, {
                    method: 'POST',
                    body: formData
                })
                .then(r => r.json())
                .then(resp => {
                    if (resp.success) {
                        document.getElementById('statusMsg').textContent = 'Custom template uploaded successfully.';
                        customTemplateFilename = resp.filename;
                        updateTemplateDisplay();
                    } else {
                        alert('Failed to upload custom template: ' + resp.error);
                    }
                })
                .catch(err => alert('Error uploading template: ' + err));
            });
        }

        const workspace = document.body;
        if (workspace) {
            // Automatically transliterate when typing in English box and pressing Enter/Tab in transliteration mode
            workspace.addEventListener('keydown', (e) => {
                const el = e.target;
                if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
                if (!el.id || !el.id.endsWith('_en')) return;

                if (transliterationEnabled) {
                    if (e.key === 'Enter' || e.key === 'Tab') {
                        transliterateField(el);
                    }
                }
            });

            // Automatically transliterate on blur in transliteration mode
            workspace.addEventListener('blur', (e) => {
                const el = e.target;
                if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
                if (!el.id || !el.id.endsWith('_en')) return;

                if (transliterationEnabled) {
                    transliterateField(el);
                }
            }, true); // Use capture phase because blur does not bubble

            // Handle keydown for ITRANS translation (Space/Enter) and DevLys Backspace
            workspace.addEventListener('keydown', (e) => {
                const el = e.target;
                if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
                if (!shouldTransliterate(el)) return;

                if (transliterationEnabled) {
                    if (e.keyCode === 32 || e.keyCode === 13) {
                        const val = el.value;
                        const pos = el.selectionStart;
                        const before = val.substring(0, pos);
                        const after = val.substring(pos);
                        const lastWordMatch = before.match(/([a-zA-Z]+)$/);
                        if (lastWordMatch) {
                            e.preventDefault();
                            const word = lastWordMatch[1];
                            const wordStart = pos - word.length;
                            const wordEnd = pos;
                            const keyCode = e.keyCode;
                            
                            fetch('/transliterate', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ text: word })
                            })
                            .then(r => r.json())
                            .then(data => {
                                let replacement = (data.success && data.result) ? data.result : Sanscript.t(word, 'itrans', 'devanagari', { syncope: true });
                                
                                const latestVal = el.value;
                                const separator = (keyCode === 32) ? ' ' : '\n';
                                
                                if (latestVal.substring(wordStart, wordEnd) === word) {
                                    const beforeWord = latestVal.substring(0, wordStart);
                                    const afterWord = latestVal.substring(wordEnd);
                                    el.value = beforeWord + replacement + separator + afterWord;
                                    const newPos = wordStart + replacement.length + separator.length;
                                    el.setSelectionRange(newPos, newPos);
                                } else {
                                    const curPos = el.selectionStart;
                                    const curVal = el.value;
                                    el.value = curVal.substring(0, curPos) + separator + curVal.substring(curPos);
                                    el.setSelectionRange(curPos + separator.length, curPos + separator.length);
                                }
                                el.dispatchEvent(new Event('input', { bubbles: true }));
                            })
                            .catch(err => {
                                console.error('Inline transliteration API error, falling back:', err);
                                const replacement = Sanscript.t(word, 'itrans', 'devanagari', { syncope: true });
                                const latestVal = el.value;
                                const separator = (keyCode === 32) ? ' ' : '\n';
                                if (latestVal.substring(wordStart, wordEnd) === word) {
                                    const beforeWord = latestVal.substring(0, wordStart);
                                    const afterWord = latestVal.substring(wordEnd);
                                    el.value = beforeWord + replacement + separator + afterWord;
                                    const newPos = wordStart + replacement.length + separator.length;
                                    el.setSelectionRange(newPos, newPos);
                                }
                                el.dispatchEvent(new Event('input', { bubbles: true }));
                            });
                        }
                    }
                }

                if (devlysEnabled) {
                    if (e.key === 'Backspace' && devlysAsciiWord.length > 0 && el.selectionStart === devlysWordStart + devlysCurrentUnicodeLen && el.selectionStart === el.selectionEnd) {
                        e.preventDefault();
                        devlysAsciiWord = devlysAsciiWord.substring(0, devlysAsciiWord.length - 1);
                        
                        const val = el.value;
                        const before = val.substring(0, devlysWordStart);
                        const after = val.substring(devlysWordStart + devlysCurrentUnicodeLen);
                        
                        if (devlysAsciiWord.length === 0) {
                            el.value = before + after;
                            devlysCurrentUnicodeLen = 0;
                            el.setSelectionRange(devlysWordStart, devlysWordStart);
                            devlysWordStart = -1;
                        } else {
                            const hindi = convertDevlysToUnicode(devlysAsciiWord);
                            el.value = before + hindi + after;
                            devlysCurrentUnicodeLen = hindi.length;
                            el.setSelectionRange(devlysWordStart + devlysCurrentUnicodeLen, devlysWordStart + devlysCurrentUnicodeLen);
                        }
                        el.dispatchEvent(new Event('input', { bubbles: true }));
                    } else if (e.key !== 'Shift' && e.key !== 'Control' && e.key !== 'Alt' && e.key !== 'Meta' && !e.ctrlKey && !e.altKey) {
                        if (el.selectionStart !== devlysWordStart + devlysCurrentUnicodeLen) {
                            devlysWordStart = -1;
                            devlysAsciiWord = "";
                            devlysCurrentUnicodeLen = 0;
                        }
                    }
                }
            });

            // Handle beforeinput for real-time DevLys mapping
            workspace.addEventListener('beforeinput', (e) => {
                if (!devlysEnabled) return;
                const el = e.target;
                if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
                if (!shouldTransliterate(el)) return;

                if (e.inputType === 'insertText' && e.data) {
                    if (e.data === ' ') {
                        devlysWordStart = -1;
                        devlysAsciiWord = "";
                        devlysCurrentUnicodeLen = 0;
                        return;
                    }
                    
                    e.preventDefault();
                    
                    const val = el.value;
                    const pos = el.selectionStart;
                    
                    if (devlysWordStart === -1 || pos !== devlysWordStart + devlysCurrentUnicodeLen) {
                        devlysWordStart = pos;
                        devlysAsciiWord = "";
                        devlysCurrentUnicodeLen = 0;
                    }
                    
                    devlysAsciiWord += e.data;
                    const hindi = convertDevlysToUnicode(devlysAsciiWord);
                    
                    const before = val.substring(0, devlysWordStart);
                    const after = val.substring(pos);
                    
                    el.value = before + hindi + after;
                    devlysCurrentUnicodeLen = hindi.length;
                    el.setSelectionRange(devlysWordStart + devlysCurrentUnicodeLen, devlysWordStart + devlysCurrentUnicodeLen);
                    el.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });
            
            // Add focus listener to inputs to add hindi-mode highlighting
            workspace.addEventListener('focusin', (e) => {
                const el = e.target;
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    if (shouldTransliterate(el)) {
                        if (transliterationEnabled || devlysEnabled) {
                            el.classList.add('hindi-mode');
                        }
                    }
                }
            });
        }
    });

    let _isSaving = false;
    let _pendingSave = null;

    function saveCase(callback, _forceRevision) {
        if (_isSaving) {
            // Queue this save request as the pending one
            _pendingSave = { callback: callback, forceRevision: _forceRevision };
            return;
        }
        _isSaving = true;

        const data = collectFieldData();
        const verified = collectVerifiedFields();
        const docType = document.getElementById('docTypeSelect').value;

        // Send the last known revision so the server can detect conflicts.
        // _forceRevision is only used internally when the user chooses
        // "Force-save my version" from the conflict dialog.
        const revisionToSend = (_forceRevision !== undefined) ? _forceRevision : _caseRevision;

        fetch(`/case/${CASE_ID}/save`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                data: data,
                doc_type: docType,
                bank: document.getElementById('bankSelect')?.value || '',
                borrowers: document.getElementById('borrowerSelect')?.value || '1',
                loans: document.getElementById('loanSelect')?.value || '1',
                properties: document.getElementById('propertiesSelect')?.value || '1',
                sellers_count: document.getElementById('sellersSelect')?.value || '1',
                buyers_count: document.getElementById('buyersSelect')?.value || '1',
                property_type: document.getElementById('propertyTypeSelect')?.value || 'Plot',
                selected_template: customTemplateFilename,
                verified_fields: verified,
                revision: revisionToSend
            })
        })
        .then(r => ({ status: r.status, json: r.json() }))
        .then(({ status, json }) => json.then(resp => {
            _isSaving = false;
            
            if (status === 409 || resp.error === 'revision_conflict') {
                // Clear pending saves on conflict to prevent cascading popups
                _pendingSave = null;
                // Server has a newer revision – surface the conflict dialog
                _showConflictDialog(callback);
                return;
            }
            if (resp.revision) {
                // Update our tracked revision to the one the server just wrote
                _caseRevision = resp.revision;
            }
            if (callback) {
                callback(resp);
            } else {
                const btn = document.querySelector('button[onclick="saveCase()"]');
                if (btn) {
                    const oldText = btn.textContent;
                    btn.textContent = '\u2705 Saved!';
                    setTimeout(() => btn.textContent = oldText, 1500);
                }
            }
            
            // Trigger checklist refresh after every successful save
            if (typeof fetchAndUpdateCaseHealth === 'function') {
                fetchAndUpdateCaseHealth();
            }
            
            // Execute the next queued save if any
            if (_pendingSave) {
                const next = _pendingSave;
                _pendingSave = null;
                setTimeout(() => {
                    saveCase(next.callback, next.forceRevision);
                }, 50);
            }
        }))
        .catch(e => {
            _isSaving = false;
            _pendingSave = null;
            alert('Save failed: ' + e);
        });
    }


    /**
     * Show a non-destructive conflict resolution dialog.
     * The user can:
     *   1. Reload server version  – discard local edits, reload page
     *   2. Keep local changes     – force-save with no revision check (sends null)
     *   3. Compare differences    – future placeholder (shows alert for now)
     *   4. Merge manually         – future placeholder
     */
    function _showConflictDialog(pendingCallback) {
        // Remove any existing conflict dialog
        const existing = document.getElementById('rm-conflict-dialog');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.id = 'rm-conflict-dialog';
        overlay.style.cssText = [
            'position:fixed;inset:0;z-index:99999;',
            'background:rgba(10,10,30,0.75);',
            'display:flex;align-items:center;justify-content:center;',
            'font-family:"Segoe UI",system-ui,sans-serif;',
            'animation:rmFadeIn 0.18s ease;'
        ].join('');

        overlay.innerHTML = `
            <style>
              @keyframes rmFadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
              #rm-conflict-box{background:#1e1e2e;border:1.5px solid #7c3aed;border-radius:14px;
                padding:28px 32px;max-width:480px;width:92%;box-shadow:0 8px 48px rgba(0,0,0,.6);color:#e0e0f0;}
              #rm-conflict-box h3{margin:0 0 8px;font-size:1.15rem;color:#c084fc;display:flex;align-items:center;gap:8px;}
              #rm-conflict-box p{margin:0 0 22px;font-size:.88rem;color:#a0a0c0;line-height:1.55;}
              .rm-cf-btn{display:block;width:100%;padding:10px 14px;margin-bottom:10px;
                border-radius:8px;border:none;cursor:pointer;font-size:.9rem;text-align:left;
                transition:filter .15s;}
              .rm-cf-btn:hover{filter:brightness(1.12);}
              .rm-cf-btn-reload{background:#1d4ed8;color:#fff;}
              .rm-cf-btn-force{background:#7c3aed;color:#fff;}
              .rm-cf-btn-compare{background:#374151;color:#d1d5db;}
              .rm-cf-btn-cancel{background:#111827;color:#6b7280;border:1px solid #374151;}
              .rm-cf-icon{font-size:1.1rem;}
            </style>
            <div id="rm-conflict-box" role="dialog" aria-labelledby="rm-cf-title" aria-modal="true">
              <h3><span class="rm-cf-icon">⚡</span>
                  <span id="rm-cf-title">Save Conflict Detected</span></h3>
              <p>Another tab or user saved this case after you loaded it.<br>
                 Your local changes are <strong>not lost</strong> — choose how to proceed.</p>
              <button class="rm-cf-btn rm-cf-btn-reload" id="rm-cf-reload">
                  🔄&nbsp; <strong>Reload server version</strong>
                  <span style="display:block;font-size:.78rem;opacity:.75;margin-top:2px">
                      Discard your current changes and load the latest saved data.</span>
              </button>
              <button class="rm-cf-btn rm-cf-btn-force" id="rm-cf-force">
                  💾&nbsp; <strong>Keep my version &amp; overwrite</strong>
                  <span style="display:block;font-size:.78rem;opacity:.75;margin-top:2px">
                      Force-save your edits on top of the server version.</span>
              </button>
              <button class="rm-cf-btn rm-cf-btn-compare" id="rm-cf-compare">
                  🔍&nbsp; <strong>Compare differences</strong>
                  <span style="display:block;font-size:.78rem;opacity:.75;margin-top:2px">
                      (Coming soon) Side-by-side diff of your edits vs server.</span>
              </button>
              <button class="rm-cf-btn rm-cf-btn-cancel" id="rm-cf-cancel">
                  ✖&nbsp; Cancel — keep editing without saving
              </button>
            </div>`;

        document.body.appendChild(overlay);

        // 1. Reload server version
        document.getElementById('rm-cf-reload').addEventListener('click', () => {
            overlay.remove();
            location.reload();
        });

        // 2. Force-save (bypass revision check by sending null)
        document.getElementById('rm-cf-force').addEventListener('click', () => {
            overlay.remove();
            saveCase(pendingCallback, null);  // null = skip revision check on server
        });

        // 3. Compare (placeholder)
        document.getElementById('rm-cf-compare').addEventListener('click', () => {
            alert('\u{1F6A7} Diff view is planned for a future release.\n\nFor now, copy important fields before reloading.');
        });

        // 4. Cancel
        document.getElementById('rm-cf-cancel').addEventListener('click', () => {
            overlay.remove();
        });

        // Close on backdrop click
        overlay.addEventListener('click', e => {
            if (e.target === overlay) overlay.remove();
        });

        // Trap focus inside dialog
        document.getElementById('rm-cf-reload').focus();
    }

    function startAI() {
        const btn = document.getElementById('startAiBtn');
        if (btn) {
            btn.disabled = true;
            btn.textContent = '⏳ AI Working...';
        }
        document.getElementById('statusMsg').textContent = 'AI is extracting details from documents...';

        const selectedFiles = Array.from(document.querySelectorAll('.file-select-checkbox:checked')).map(cb => cb.getAttribute('data-filename'));
        
        saveCase(() => {
            fetch(`/case/${CASE_ID}/ai`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    doc_type: document.getElementById('docTypeSelect').value,
                    bank: document.getElementById('bankSelect')?.value || '',
                    borrowers: document.getElementById('borrowerSelect')?.value || '1',
                    loans: document.getElementById('loanSelect')?.value || '1',
                    properties: document.getElementById('propertiesSelect')?.value || '1',
                    sellers_count: document.getElementById('sellersSelect')?.value || '1',
                    buyers_count: document.getElementById('buyersSelect')?.value || '1',
                    property_type: document.getElementById('propertyTypeSelect')?.value || 'Plot',
                    model: document.getElementById('modelSelect').value,
                    selected_files: selectedFiles
                })
            })
            .then(r => r.json())
            .then(resp => {
                if (resp.success) {
                    document.getElementById('statusMsg').textContent = 'Automation complete!';
                    location.reload();
                } else {
                    alert('AI Automation Error: ' + (resp.error || 'Unknown'));
                    document.getElementById('statusMsg').textContent = 'Error';
                }
            })
            .catch(e => {
                alert('Failed to execute AI scan: ' + e);
                document.getElementById('statusMsg').textContent = 'Error';
            })
            .finally(() => {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🤖 Start AI Automation';
                }
            });
        });
    }

    function startAIForBucket(bucket, btn, isRegenerate = false) {
        const oldText = btn.textContent;
        const statusMsg = document.getElementById('statusMsg');
        
        const checkboxes = Array.from(document.querySelectorAll(`.file-select-chk[data-bucket="${bucket}"]`));
        let selectedFiles = null;
        if (checkboxes.length > 0) {
            selectedFiles = checkboxes.filter(chk => chk.checked).map(chk => chk.getAttribute('data-filename'));
            if (selectedFiles.length === 0) {
                alert('Please select at least one file to process.');
                return;
            }
        }
        
        btn.disabled = true;
        btn.textContent = isRegenerate ? '⏳ Re-generating...' : '⏳ Extracting...';
        if (statusMsg) statusMsg.textContent = isRegenerate ? `AI is re-generating narrative from ${bucket} documents...` : `AI is extracting details from ${bucket} documents...`;

        saveCase(() => {
            fetch(`/case/${CASE_ID}/ai`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    doc_type: document.getElementById('docTypeSelect').value,
                    bank: document.getElementById('bankSelect')?.value || '',
                    borrowers: document.getElementById('borrowerSelect')?.value || '1',
                    loans: document.getElementById('loanSelect')?.value || '1',
                    properties: document.getElementById('propertiesSelect')?.value || '1',
                    sellers_count: document.getElementById('sellersSelect')?.value || '1',
                    buyers_count: document.getElementById('buyersSelect')?.value || '1',
                    property_type: document.getElementById('propertyTypeSelect')?.value || 'Plot',
                    model: document.getElementById('modelSelect').value,
                    bucket: bucket,
                    regenerate: isRegenerate,
                    selected_files: selectedFiles
                })
            })
            .then(r => r.json())
            .then(resp => {
                if (resp.success) {
                    if (statusMsg) statusMsg.textContent = 'Extraction complete!';
                    location.reload();
                } else {
                    alert('AI Extraction Error: ' + (resp.error || 'Unknown'));
                    if (statusMsg) statusMsg.textContent = 'Error';
                }
            })
            .catch(e => {
                alert('Failed to execute AI scan: ' + e);
                if (statusMsg) statusMsg.textContent = 'Error';
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = oldText;
            });
        });
    }



    function generateRM() {
        const data = collectFieldData();
        const verified = collectVerifiedFields();
        const docType = document.getElementById('docTypeSelect').value;

        fetch(`/case/${CASE_ID}/generate`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                doc_type: docType,
                bank: document.getElementById('bankSelect')?.value || '',
                borrowers: document.getElementById('borrowerSelect')?.value || '1',
                loans: document.getElementById('loanSelect')?.value || '1',
                properties: document.getElementById('propertiesSelect')?.value || '1',
                sellers_count: document.getElementById('sellersSelect')?.value || '1',
                buyers_count: document.getElementById('buyersSelect')?.value || '1',
                property_type: document.getElementById('propertyTypeSelect')?.value || 'Plot',
                selected_template: customTemplateFilename,
                data: data,
                verified_fields: verified
            })
        })
        .then(r => {
            if (r.ok) return r.blob();
            return r.json().then(e => { throw new Error(e.detail || e.error || 'Generation failed'); });
        })
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const bank = docType === 'SD' ? 'SD' : (document.getElementById('bankSelect').value || 'RM');
            a.download = `${docType}_${bank}_${CASE_ID}.docx`;
            a.click();
            window.URL.revokeObjectURL(url);
        })
        .catch(e => alert('Generation failed: ' + e.message));
    }
